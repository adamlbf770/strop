[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strop-cli"
dynamic = ["version"]
description = "Command-line tool that improves LLM prompts by testing them against your own data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Baran Yalcin" }]
keywords = ["llm", "prompt", "prompt-optimization", "evaluation", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.23",
    "litellm>=1.60",
    "pydantic>=2.9",
    "ruamel-yaml>=0.18",
    "typer>=0.15",
]

[project.scripts]
strop = "strop.cli:main"

[project.urls]
Homepage = "https://github.com/baranylcn/strop"
Documentation = "https://github.com/baranylcn/strop/tree/main/docs"
Changelog = "https://github.com/baranylcn/strop/blob/main/CHANGELOG.md"
Issues = "https://github.com/baranylcn/strop/issues"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "types-jsonschema>=4.26.0.20261006",
]

[tool.hatch.version]
path = "src/strop/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/strop"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PT", "ASYNC", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"src/strop/cli/*" = ["PLR0913", "PLR0917"]

[tool.ruff.lint.pylint]
max-args = 7
max-statements = 40

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
